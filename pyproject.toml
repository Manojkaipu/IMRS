[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imrs"
version = "1.0.0"
description = "Self-expanding image retrieval: CLIP / ResNet / ViT / DINOv2 embeddings, FAISS & Annoy indexes, metric-learning adapter, Streamlit app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "tqdm>=4.65",
    "torch>=2.1",
    "torchvision>=0.16",
    "faiss-cpu>=1.7.4",
    "annoy>=1.17",
    "imagehash>=4.3",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "clip-anytorch>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "duckduckgo-search>=6.0"]  # the newer `ddgs` package also works
preprocess = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
imrs = "imrs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "B905"]
